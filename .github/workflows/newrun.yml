name: Build Cloudstream Plugins

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# ABILITA I PERMESSI DI SCRITTURA GLOBALI PER CONSENTIRE IL PUSH SUL BRANCH 'builds':
permissions:
  contents: write

jobs:
  build_plugin:
    name: Build Plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/**/gradle-wrapper.properties', 'src/**/*.gradle*', 'src/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject API Keys into local.properties
        working-directory: ${{ github.workspace }}/src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API }}
        run: |
          echo "Creazione del file local.properties per la build..."
          echo "TMDB_API=\"$TMDB_API_KEY\"" > local.properties

      # Avvia il task 'make' globale: compila OdmVod, ArchivioTelegram e qualsiasi altro plugin futuro in un colpo solo
      - name: Build All Plugins
        working-directory: ${{ github.workspace }}/src
        run: |
          chmod +x gradlew
          echo "Avvio build Gradle globale per tutti i plugin..."
          ./gradlew clean make makePluginsJson --no-daemon --scan

      # Trova e copia dinamicamente tutti i file .cs3 generati ovunque si trovino
      - name: Prepare Artifacts for Upload
        run: |
          ARTIFACTS_UPLOAD_DIR="${{ github.workspace }}/artifacts-to-upload"
          mkdir -p "$ARTIFACTS_UPLOAD_DIR"
          
          echo "Ricerca e copia di tutti i file .cs3 generati..."
          find ${{ github.workspace }}/src -name "*.cs3" -exec cp {} "$ARTIFACTS_UPLOAD_DIR/" \;
          
          PLUGINS_JSON_PATH="${{ github.workspace }}/src/build/plugins.json"
          echo "Verifica e copia di plugins.json..."
          if [ -f "$PLUGINS_JSON_PATH" ]; then
            cp "$PLUGINS_JSON_PATH" "$ARTIFACTS_UPLOAD_DIR/"
            echo "plugins.json copiato con successo."
          else
            echo "ERRORE: plugins.json non trovato in $PLUGINS_JSON_PATH!"
            exit 1 
          fi
          
          echo "Contenuto della cartella pronto per l'upload:"
          ls -la "$ARTIFACTS_UPLOAD_DIR"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins-build-artifacts
          path: ${{ github.workspace }}/artifacts-to-upload
          if-no-files-found: error

  publish_to_builds_branch:
    name: Publish to 'builds' Branch
    needs: build_plugin
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudstream-plugins-build-artifacts
          path: ${{ github.workspace }}/artifacts-to-deploy

      - name: Push to builds branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/artifacts-to-deploy
          publish_branch: builds
          force_orphan: false
          keep_files: true
          commit_message: "Auto-update plugin build [skip ci]"
